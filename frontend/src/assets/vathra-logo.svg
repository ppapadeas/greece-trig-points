    fill="none" stroke="#1C1A14" stroke-width="3"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- A-frame support — slim, minimal -->
  <line x1="44" y1="46" x2="50" y2="72" stroke="#1C1A14" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="46" x2="50" y2="72" stroke="#1C1A14" stroke-width="2" stroke-linecap="round"/>
  <!-- A crossbar -->
  <line x1="46" y1="57" x2="54" y2="57" stroke="#1C1A14" stroke-width="2" stroke-linecap="round"/>
  <!-- Survey disc — terracotta with hole -->
  <circle cx="50" cy="31" r="15" fill="#C2652A" stroke="#1C1A14" stroke-width="2.8"/>
  <circle cx="50" cy="31" r="6"  fill="#F7F2E8" stroke="#1C1A14" stroke-width="2"/>
